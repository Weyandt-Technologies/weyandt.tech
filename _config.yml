# Site settings for weyandt.tech
# Jekyll on GitHub Pages, using the Minimal Mistakes remote theme.
# Note: this file is NOT reloaded automatically by `jekyll serve`; restart after editing.

title: Weyandt Technologies LLC
masthead_title: Weyandt Technologies
email: contact@weyandt.tech
description: >-
  Fractional CISO services, independent security assessments, and senior software and
  AWS engineering for healthcare, legal, and education organizations in Northeast Ohio.
locale: en-US

# The base hostname and protocol. Must be a real origin. An incomplete value here
# silently breaks every canonical tag, og:url, and og:image across the site.
url: "https://weyandt.tech"
baseurl: ""

# Default social sharing image (absolute URL is built by the theme from `url`).
og_image: /assets/images/gear_splash.jpg

# Drives the JSON-LD block emitted by the theme's seo.html. Without this it
# publishes `{"@type": "Person", "name": null}`.
social:
  type: Organization
  name: Weyandt Technologies LLC

# Build settings
# Needed by the github-pages gem when building outside of GitHub Actions
# (it resolves the origin remote otherwise).
repository: "Weyandt-Technologies/weyandt.tech"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"

include: ["_pages"]

exclude:
  - assets/images/src   # full-resolution originals; the optimized derivatives ship instead
  - Gemfile
  - Gemfile.lock
  - vendor

# Disable the atom feed link in the footer
atom_feed:
  hide: true

plugins:
  - jekyll-include-cache
  - jekyll-sitemap

# Every page shares the same hero treatment, so set it once here instead of
# repeating a five-line `header:` block in each file's front matter.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: splash
      header:
        overlay_color: "#0f4c5c"
        overlay_filter: "linear-gradient(to right, rgba(11, 45, 54, 0.94), rgba(11, 45, 54, 0.72) 60%, rgba(11, 45, 54, 0.45))"
        overlay_image: /assets/images/gear_splash.jpg
